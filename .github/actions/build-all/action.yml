name: 'Build All Targets'
description: 'Build firmware for all ESP32 targets'

inputs:
  idf-version:
    description: 'ESP-IDF version'
    required: true
    default: 'v5.5.1'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Demo/package-lock.json

    - name: Build frontend
      shell: bash
      run: python scripts/build_frontend.py --ci

    - name: Embed frontend
      shell: bash
      run: python scripts/embed_frontend.py --ci

    - name: Build all ESP32 targets
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ inputs.idf-version }}
        path: 'Firmware'
        command: python ../scripts/build_all.py --ci