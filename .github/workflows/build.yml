name: Build Mesh-NOW

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "Docs/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "Docs/**"
  workflow_dispatch:

env:
  IDF_VERSION: "v5.5.1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s2, esp32s3, esp32c3, esp32c6]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build target
        id: build
        uses: ./.github/actions/build-target
        with:
          target: ${{ matrix.target }}
          idf-version: ${{ env.IDF_VERSION }}
          sha: ${{ github.sha }}

      - name: Report binary size
        run: 'echo "Built ${{ matrix.target }}: ${{ steps.build.outputs.binary-size }} KB"'

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-now-${{ matrix.target }}-${{ github.sha }}
          path: |
            Firmware/build/mesh-now.bin
            Firmware/build/bootloader/bootloader.bin
            Firmware/build/partition_table/partition-table.bin
            Firmware/build_info.txt
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.target }}-${{ github.sha }}
          path: |
            Firmware/build/log/
          retention-days: 7
