name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate packaging without attaching firmware to a release'
        type: boolean
        default: false

env:
  IDF_VERSION: 'v5.5.1'

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build all targets
        uses: ./.github/actions/build-all
        with:
          idf-version: ${{ env.IDF_VERSION }}

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Package release
        run: just release "${{ github.event.release.tag_name || 'dry-run' }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mesh-now-release-${{ github.event.release.tag_name || 'dry-run' }}
          path: release/
          retention-days: 90

  attach-to-release:
    name: Attach Firmware to GitHub Release
    if: github.event_name == 'release' && !inputs.dry_run
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: mesh-now-release-${{ github.event.release.tag_name }}
          path: release/

      - name: Attach firmware to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/firmware/*.tar.gz
            release/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}