name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  IDF_VERSION: 'v5.5.1'

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version || github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          mkdir -p ci-artifacts

          # Previous release tag, or the root commit when this is the first release.
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          {
            echo "## Changes since $PREV_TAG"
            echo
            git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD"
            echo
          } > ci-artifacts/CHANGELOG.md

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat ci-artifacts/CHANGELOG.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        uses: ./.github/actions/build-all
        with:
          idf-version: ${{ env.IDF_VERSION }}

      - name: Package release
        run: |
          mkdir -p release/{firmware,flash-tools,documentation}

          # Flash tools
          cp scripts/install_esptool.py release/flash-tools/
          cp scripts/flash_mesh_now.py release/flash-tools/

          # Per-target firmware packages
          for dir in Firmware/builds/*/; do
            target_name=$(basename "$dir")
            echo "Packaging $target_name..."
            mkdir -p "release/firmware/$target_name"
            cp "$dir/mesh-now.bin" "release/firmware/$target_name/"
            cp "$dir/bootloader.bin" "release/firmware/$target_name/"
            cp "$dir/partition-table.bin" "release/firmware/$target_name/"
            cp scripts/flash.py "release/firmware/$target_name/"
            tar -czf "release/mesh-now-$target_name-${{ steps.version.outputs.version }}.tar.gz" \
              -C "release/firmware" "$target_name"
          done

          # Documentation
          cp README.md release/documentation/
          cp Docs/docs/getting-started/quickstart.md release/documentation/QUICKSTART.md

      - name: Create release checksums
        run: |
          cd release
          find . -type f \( -name '*.tar.gz' -o -name '*.bin' \) -print0 | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-now-release-${{ steps.version.outputs.version }}
          path: release/
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name != 'release'  # Don't duplicate if triggered by release

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: mesh-now-release-${{ needs.build-release.outputs.version }}
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-release.outputs.version }}
          name: Mesh-NOW ${{ needs.build-release.outputs.version }}
          body: ${{ needs.build-release.outputs.changelog }}
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}