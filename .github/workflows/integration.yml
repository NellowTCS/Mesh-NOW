name: Integration Tests

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  idf-compatibility:
    name: ESP-IDF ${{ matrix.idf_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf_version: ['v5.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build esp32 with ${{ matrix.idf_version }}
        uses: ./.github/actions/build-target
        with:
          target: esp32
          idf-version: ${{ matrix.idf_version }}
          sha: ${{ github.sha }}
